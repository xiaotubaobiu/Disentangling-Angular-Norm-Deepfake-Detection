augment:
  brightness_contrast_p: 0.5
  brightness_limit: 0.1
  compression_p: 0.2
  compression_quality_lower: 40
  compression_quality_upper: 100
  contrast_limit: 0.1
  horizontal_flip_p: 0.5
  rotate_limit: 10
  rotate_p: 0.5

dataset:
  root: /Dataset/deepfake_detection/DF40_all
  train_videos_per_method: 586
  val_videos_per_method: 100
  frames_per_video: 8
  image_size: 224
  methods: []
  real_sampling: oversample_per_method
  use_mask: false

loss:
  name: cross_entropy

train:
  distributed: ddp
  gpus_per_node: 8
  num_nodes: 1
  launcher: torchrun
  num_workers: 8
  output_dir: experiments
  precision: amp
  seed: 42
