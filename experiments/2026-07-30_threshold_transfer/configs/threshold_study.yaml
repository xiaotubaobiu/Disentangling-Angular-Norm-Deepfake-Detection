# experiments/2026-07-30_threshold_transfer/configs/threshold_study.yaml
#
# All `inputs` are repository-root relative (they are produced by earlier phases
# and read-only here). All `paths` are relative to THIS phase directory. Scripts
# resolve both from their own file location, so they run from anywhere.

global_seed: 20260730

inputs:
  # phase 2026-07-21: frame-level scores for all 30 checkpoints (target domain)
  frame_scores: experiments/2026-07-21_frame_midterm_diagnosis/results/parallel_20260721_213914/per_frame_scores.parquet
  # phase 2026-05-05: the 30 retained checkpoints (only needed to re-infer FF++ val)
  checkpoint_root: experiments/2026-05-05_paper_feature_geometry/results/checkpoints
  # phase 2026-07-27: per-frame FF++ VALIDATION scores (s_raw / s_dir) per checkpoint.
  # FF++ val is absent from the frame parquet above (its `ffpp` rows are the test
  # split), so this cache is the source-domain input. Read-only, never copied.
  source_val_cache: experiments/2026-07-27_pooling_saturation/results/val_cache

dims:
  backbones: [clip, dinov2, efficientnet]
  seeds: [7, 42, 123, 999, 2048]
  train_mode: raw          # only raw-trained checkpoints expose raw AND direction
  modes: [raw, direction]
  methods: [simswap, inswap, blendface, faceswap, fsgan, mobileswap, e4s, facedancer,
            fomm, facevid2vid, wav2lip, sadtalker, MRAA, pirender, tpsm, lia]

domains:
  source: ffpp             # FF++ validation split
  target: cdf
  exclude: [dfd]

protocol:
  # primary video score: mean over frames of signed_logit = fake_logit - real_logit
  video_aggregator: mean_logit
  # deliberately mis-specified baseline, reported for contrast only
  baseline_aggregator: mean_prob
  threshold_rules: [t_BA, t_equal, t_FPR1, t_FPR5]
  calibration_rules: [t_p50_temperature, t_p50_platt]
  fixed_fpr_targets:
    t_FPR1: 0.01
    t_FPR5: 0.05
  bootstrap_iterations: 2000
  bootstrap_seed: 20260730
  # |R_transfer| below this counts as "the threshold transfers"
  ba_drop_threshold: 0.05

dry_run:
  backbones: [clip]
  seeds: [42]
  methods: [fsgan, sadtalker]
  bootstrap_iterations: 200

paths:
  tables: results/tables
  val_cache: results/val_cache
  logs: results/logs
  figures: figures
  reports: reports

outputs:
  # phase-local full report
  report: reports/threshold_transfer_final_report.md
  # repo-root relative digest written by the same script (no divergent copies)
  root_digest: reports/threshold_transfer_final_report.md
