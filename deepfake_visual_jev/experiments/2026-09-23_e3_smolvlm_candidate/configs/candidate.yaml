experiment_name: e3_smolvlm_candidate
dataset:
  root: /Dataset/deepfake_detection/DF40_all
  methods: []
  train_videos_per_method: 586
  val_videos_per_method: 100
  frames_per_video: 8
  image_size: 224
language:
  manifest: experiments/2026-09-22_semantic_visual_jev_e2/configs/language_bank.yaml
  train_tasks: [T1, T2, T3, T4, T5]
model:
  name: smolvlm_candidate
  pretrained: experiments/2026-09-23_e3_smolvlm_candidate/results/pretrained/smolvlm_256m
  revision: 7e3e67edbbed1bf9888184d9df282b700a323964
  score_batch_size: 96
  gradient_checkpointing: false
  frozen_vision: true
  frozen_connector: true
  native_image_size: 512
  image_splitting: false
train:
  output_dir: experiments/2026-09-23_e3_smolvlm_candidate/results/training
  epochs: 15
  language_lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 1.0e-2
  patience: 5
  warmup_epochs: 1
  ema_decay: 0.999
  per_gpu_batch: 32
  accumulation_steps: 4
  num_workers: 4
  prefetch_factor: 2
  precision: amp_fp16
  seeds: [42, 7, 2048]
evaluation:
  diagnostics_manifest: experiments/2026-09-23_e3_smolvlm_candidate/configs/diagnostics.yaml
  primary_domains: [ffpp, cdf]
  conditions: [fixed_h1, seen, heldout, permutation, counterfactual, meaningless_candidates, meaningless_questions]
  permutation_audit_samples: 4096
  bootstrap_samples: 10000
  bootstrap_seed: 20260922
gates:
  noninferiority_margin: 0.01
  heldout_macro_drop_max: 0.02
  heldout_task_drop_max: 0.05
  permutation_error_max: 1.0e-6
  t2_balanced_accuracy_min: 0.80
  t2_polarity_consistency_min: 0.95
  t4_balanced_accuracy_min: 0.65
  t4_counterfactual_order_min: 0.80
  t5_macro_balanced_accuracy_min: 0.60
  meaningless_drop_min: 0.10
