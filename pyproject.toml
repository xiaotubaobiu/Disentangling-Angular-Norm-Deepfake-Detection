[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake_detection"
version = "0.1.0"

# src/ is flat: every top-level package under it (data, models, engine, losses,
# evaluation, diagnosis, study, study_pooling) plus the config_io module.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["config_io"]

[tool.pytest.ini_options]
# `--import-mode=importlib` keeps same-named test files in different phase
# directories (e.g. two `test_config.py`) from colliding.
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests", "experiments"]
